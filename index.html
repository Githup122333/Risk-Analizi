<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Saha Risk Kaydı</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Risk Kaydı">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#152225">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23152225'/%3E%3Ctext x='50' y='62' font-size='46' text-anchor='middle' fill='%23F6F3EC' font-family='Arial'%3E⚠%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23152225'/%3E%3Ctext x='50' y='62' font-size='46' text-anchor='middle' fill='%23F6F3EC' font-family='Arial'%3E⚠%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20282B;
    --paper:#F6F3EC;
    --paper2:#FFFFFF;
    --chrome:#152225;
    --chrome2:#1C3238;
    --accent:#2F7A75;
    --accent-dark:#1F5A56;
    --accent-ink:#E9F4F2;
    --low:#4C7A52; --low-bg:#E6EEE3; --low-line:#BFD4BC;
    --med:#A8730C; --med-bg:#FBF0D8; --med-line:#E7CE94;
    --high:#AE4432; --high-bg:#FAE1DB; --high-line:#E3B5A9;
    --border:#E1DACB;
    --muted:#7A766B;
    --danger:#B23B2E;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--chrome);}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    color:var(--ink);
    display:flex; justify-content:center;
    min-height:100vh;
  }
  #shell{
    width:100%; max-width:480px; min-height:100vh;
    background:var(--paper);
    display:flex; flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.35);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',system-ui,sans-serif;}

  /* App bar */
  .appbar{
    background:linear-gradient(180deg,var(--chrome2),var(--chrome));
    color:#fff; padding:16px 18px 14px;
    position:sticky; top:0; z-index:20;
  }
  .appbar-row{display:flex; align-items:center; gap:10px;}
  .appbar-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:0.2px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .appbar-sub{font-size:12px; color:#B9CFCC; margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .icon-btn{
    width:36px;height:36px; border-radius:10px; border:none;
    background:rgba(255,255,255,0.08); color:#fff; font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,0.18);}

  /* Content */
  #content{flex:1; padding:16px 16px 100px;}

  /* Empty state */
  .empty{
    text-align:center; padding:56px 20px; color:var(--muted);
  }
  .empty .stamp{
    width:64px;height:64px;border-radius:50%;
    border:2px dashed var(--border); margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .empty h3{font-family:'Space Grotesk',sans-serif; color:var(--ink); margin:0 0 6px;}
  .empty p{font-size:14px; line-height:1.5; margin:0 auto; max-width:280px;}

  /* Project cards */
  .proj-card{
    background:var(--paper2); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 14px; margin-bottom:12px; cursor:pointer; position:relative;
    display:flex; gap:12px; align-items:center;
  }
  .proj-card:active{transform:scale(0.99);}
  .proj-idx{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);
    width:34px;height:34px;border-radius:9px;background:var(--paper);
    display:flex;align-items:center;justify-content:center; flex-shrink:0; border:1px solid var(--border);
  }
  .proj-main{flex:1; min-width:0;}
  .proj-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; margin:0 0 3px;}
  .proj-meta{font-size:12px; color:var(--muted);}
  .proj-badges{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; font-family:'IBM Plex Mono',monospace;}
  .badge.low{background:var(--low-bg); color:var(--low);}
  .badge.med{background:var(--med-bg); color:var(--med);}
  .badge.high{background:var(--high-bg); color:var(--high);}
  .badge.neutral{background:#EEEAE0; color:var(--muted);}
  .proj-del{
    position:absolute; top:10px; right:10px; width:28px;height:28px; border-radius:8px;
    border:none; background:transparent; color:var(--muted); font-size:15px; cursor:pointer;
  }

  .fab{
    position:absolute; right:18px; bottom:24px; z-index:15;
    background:var(--accent); color:#fff; border:none; border-radius:16px;
    padding:14px 20px; font-size:15px; font-weight:600; font-family:'IBM Plex Sans',sans-serif;
    box-shadow:0 8px 20px rgba(47,122,117,0.4); cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .fab:active{background:var(--accent-dark);}

  /* Matrix panel */
  .matrix-toggle{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper2); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:12px; cursor:pointer;
  }
  .matrix-toggle .t{font-weight:600; font-size:14px; font-family:'Space Grotesk',sans-serif;}
  .matrix-toggle .c{font-size:12px; color:var(--muted);}
  .matrix-panel{
    background:var(--paper2); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin:-4px 0 12px; font-size:12px;
  }
  .mtable{width:100%; border-collapse:collapse; margin-bottom:10px; font-family:'IBM Plex Mono',monospace; font-size:11px;}
  .mtable th,.mtable td{border:1px solid var(--border); text-align:center; padding:5px 2px;}
  .mtable th{background:var(--paper); font-weight:600; font-size:10px;}
  .mtable td.corner{background:var(--chrome); color:#fff; font-size:9px; font-family:'IBM Plex Sans';}
  .mlegend{display:flex; flex-direction:column; gap:5px;}
  .mlegend .row{display:flex; align-items:center; gap:8px; font-size:11.5px;}
  .mlegend .sw{width:14px;height:14px;border-radius:4px; flex-shrink:0;}

  /* Risk entry cards */
  .rk-card{
    background:var(--paper2); border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:10px; overflow:hidden;
  }
  .rk-head{display:flex; gap:10px; padding:13px 14px; cursor:pointer; align-items:flex-start;}
  .rk-no{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
    background:var(--paper); border:1px solid var(--border); border-radius:8px;
    padding:3px 7px; flex-shrink:0; margin-top:2px;
  }
  .rk-body{flex:1; min-width:0;}
  .rk-tehlike{font-weight:600; font-size:14.5px; line-height:1.35;}
  .rk-risk{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.4;}
  .rk-chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .chip{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--paper); border:1px solid var(--border); color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .rk-score{
    width:42px;height:42px; border-radius:10px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; line-height:1;
  }
  .rk-score span{font-size:8px; font-weight:600; margin-top:2px; letter-spacing:0.3px;}
  .rk-detail{border-top:1px solid var(--border); padding:12px 14px 14px; background:var(--paper);}
  .etk-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper2); border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; margin-bottom:7px; font-size:12.5px;
  }
  .etk-grp{font-weight:500;}
  .etk-nums{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);}
  .etk-rs{
    font-weight:700; border-radius:6px; padding:2px 7px; color:#fff; font-size:12px;
  }
  .onlem-box{
    font-size:12.5px; line-height:1.5; background:var(--paper2); border:1px solid var(--border);
    border-radius:10px; padding:10px 11px; margin-top:8px; white-space:pre-wrap;
  }
  .onlem-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .rk-actions{display:flex; gap:8px; margin-top:10px;}
  .btn{
    border:none; border-radius:9px; padding:9px 12px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.primary:active{background:var(--accent-dark);}
  .btn.ghost{background:var(--paper2); color:var(--ink); border:1px solid var(--border);}
  .btn.danger{background:#fff; color:var(--danger); border:1px solid var(--high-line);}
  .btn.block{width:100%;}
  .btn.sm{padding:6px 10px; font-size:12px;}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,20,21,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
    background:var(--paper); border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:slideup 0.22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .modal-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; margin:2px 0 16px; display:flex; justify-content:space-between; align-items:center;}
  .modal-title .x{cursor:pointer; color:var(--muted); font-size:20px; padding:2px 6px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px;}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 11px;
    font-size:14.5px; font-family:'IBM Plex Sans',sans-serif; background:#fff; color:var(--ink);
  }
  .field textarea{min-height:70px; resize:vertical; line-height:1.4;}
  .field input[type=date]{min-height:42px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .subhead{display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px;}
  .subhead h4{font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0;}
  .etk-form-row{
    background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:9px;
  }
  .etk-form-grid{display:grid; grid-template-columns:1fr 68px 68px; gap:7px; align-items:end;}
  .etk-form-grid label{font-size:10px; color:var(--muted); font-weight:600; display:block; margin-bottom:4px;}
  .etk-form-grid select{padding:8px 7px; font-size:13px;}
  .etk-form-grid2{display:grid; grid-template-columns:1fr 68px 68px; gap:7px; align-items:end; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
  .etk-form-grid2 .lbl{font-size:10px; color:var(--muted); font-weight:600; line-height:1.3;}
  .etk-form-grid2 label{font-size:10px; color:var(--muted); font-weight:600; display:block; margin-bottom:4px;}
  .etk-form-grid2 select{padding:8px 7px; font-size:13px; width:100%;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ai-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;}
  .ai-row label{margin-bottom:0 !important;}
  .etk-remove{display:flex; justify-content:flex-end; margin-top:6px;}
  .etk-remove button{background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer; font-weight:600;}
  .live-rs{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--muted);}
  .live-rs .dot{width:10px;height:10px;border-radius:3px;}
  .confirm-text{font-size:14px; line-height:1.5; margin-bottom:18px; color:var(--ink);}
  .modal-btn-row{display:flex; gap:10px;}
  .modal-btn-row .btn{flex:1;}
  .helper{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.4;}

  /* toast */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(120%);
    background:var(--chrome); color:#fff; padding:11px 18px; border-radius:99px; font-size:13px;
    z-index:80; transition:transform 0.25s ease; box-shadow:0 8px 24px rgba(0,0,0,0.3);
    max-width:88%; text-align:center;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  /* print — SBU_Van_Risk_Degerlendirme_son.xlsx şablonu (A3 yatay, 18 sütun) */
  #printArea{display:none;}
  @media print{
    html,body{background:#fff !important; display:block !important; width:auto !important; height:auto !important;}
    #shell{display:none !important;}
    #modalRoot,#toast{display:none !important;}
    #printArea{display:block !important; width:100% !important; max-width:none !important; margin:0 !important; padding:0 !important; container-type:inline-size;}
    #printArea, #printArea *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    table.pr-sheet{border-collapse:collapse; table-layout:fixed; width:100%; font-family:Arial,Helvetica,sans-serif; color:#000;}
    table.pr-sheet td{padding:1.5pt 3pt; padding:0.13cqw 0.26cqw; border:none; overflow:hidden; overflow-wrap:anywhere; word-break:break-word; line-height:1.2;}
    table.pr-sheet thead{display:table-header-group;}
    table.pr-sheet tbody{break-inside:avoid; page-break-inside:avoid;}
    table.pr-sheet tr{break-inside:avoid; page-break-inside:avoid;}
  }
  @page{size:A3 landscape; margin:8mm 6mm 10mm 6mm;}
</style>
</head>
<body>
<div id="shell">
  <div id="app-visible-content" style="display:flex; flex-direction:column; flex:1;">
    <div class="appbar" id="appbar"></div>
    <div id="content"></div>
  </div>
  <div id="fabHolder"></div>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ---------------------------------------------------------
   VERİ MODELİ
   index key -> [{id, isim, kurum, olusturma, guncelleme, sonRK}]
   proje_{id} key -> { id, isim, kurum, olusturma, guncelleme, sonRK, satirlar:[
      { id, rk,
        tehlike,   -> şablon: Tanımlanan Tehlikeler
        risk,      -> şablon: Belirlenen Riskler
        mevcut,    -> şablon: Mevcut Durum ve Tedbirler
        onlemler,  -> şablon: Planlanan İyileştirici Faaliyetler (eski 'Alınması Gereken Önlemler')
        sorumlu, termin, kapatma,  -> şablon: Sorumlular / Termin / Kapatma Tarihi
        notlar,    -> şablon: Açıklama
        durum,     -> yapilmadi | devam | yapildi (Açıklama sütununa yazılır)
        etkilenenler:[{id, grup, olasilik, siddet, olasilikSonra, siddetSonra}]  (şablon bloğu: en fazla 5 satır)
      }
   ]}
--------------------------------------------------------- */

const ETKILENEN_GRUPLARI = [
  "Doktor","Hemşire / Sağlık Memuru","Anestezi Teknisyeni","Temizlik Personeli",
  "Güvenlik Personeli","Hastalar","Ziyaretçiler","Tıbbi Sekreter / Otomasyon Görevlisi","Teknik Personel / İşçi","Diğer"
];

const DURUMLAR = {
  yapilmadi: {label:'Yapılmadı', hex:'#B23B2E', hexbg:'#FAE1DB'},
  devam:     {label:'Çalışma Devam Ediyor', hex:'#A8730C', hexbg:'#FBF0D8'},
  yapildi:   {label:'Yapıldı', hex:'#2F7A75', hexbg:'#DCEEEC'}
};
function durumBilgi(key){ return DURUMLAR[key] || DURUMLAR.yapilmadi; }
const MODEL_ESKI_ID = {'claude-sonnet-5':'claude-sonnet-5-5', 'claude-opus-5':'claude-opus-5-5'}; // eski kayıtlı seçimler yeni sürüme taşınır
function varsayilanModel(){
  if(AI_MODELS['claude-sonnet-5-5']) return 'claude-sonnet-5-5';
  const s = Object.keys(AI_MODELS).find(function(k){ return k.indexOf('sonnet')>=0; });
  return s || Object.keys(AI_MODELS)[0];
}
function gecerliModel(m){ m = MODEL_ESKI_ID[m] || m; return (m && AI_MODELS[m]) ? m : varsayilanModel(); }

const ONLEM_KURALLARI = "Planlanan İyileştirici Faaliyetler sütununu yaz. Kurallar: (1) Talimat kartı dilinde yaz: her cümle kısa olsun, tek bir önlem içersin, gerekçe ve açıklama içermesin; anlamı bozmadan sadeleştir. Cümleler '-malı / -meli' ile bitsin (örn. 'Gaz dedektörü monte edilmeli.'). (2) Uzunluğu tehlikenin karmaşıklığına göre ayarla: basit tehlikede 3-5, çok yönlü tehlikede 8-12 kısa cümle yaz. Cümle sayısını doldurmak için önlem uydurma; tekrar ve dolgu olmasın. (3) En kritik önlemle başla. (4) Mevzuat madde numarası yazma. Yönetmelik veya standart adı yazılabilir. (5) Mevcut Durum yalnızca durum tespitidir. Orada yazan önlemleri silme veya atlama; kalıcılığını güvence altına alan faaliyetleri de yaz (bypass'ı engelleyen sistem, saha denetimi/kontrol formu, ihlalde tutanak, tekrar eğitim). (6) Sorumlu ve tarih yazma. Başlık, madde imi, numaralama kullanma; tek paragraf düz metin yaz ve tam cümleyle bitir.";

const AI_MODELS = {
  'claude-haiku-4-5-20251001': {label:'Haiku 4.5', hint:'En hızlı ve en ucuz — basit/rutin öneriler için yeterli'},
  'claude-sonnet-5-5':         {label:'Sonnet 5.5', hint:'Dengeli — genel kullanım için önerilir'},
  'claude-opus-5-5':           {label:'Opus 5.5',   hint:'En güçlü — karmaşık/kritik tehlikelerde dene'},
  'claude-fable-5-1':          {label:'Fable 5.1', hint:'En üst segment — en pahalı, nadiren gerekir'}
};

const MODEL_AILE_HINT = {
  haiku:  'En hızlı ve en ucuz — basit/rutin öneriler için yeterli',
  sonnet: 'Dengeli — genel kullanım için önerilir',
  opus:   'En güçlü — karmaşık/kritik tehlikelerde dene',
  fable:  'En üst segment — en pahalı, nadiren gerekir'
};
function modelListesiniUygula(obj){
  Object.keys(AI_MODELS).forEach(function(k){ delete AI_MODELS[k]; });
  Object.keys(obj).forEach(function(k){ AI_MODELS[k] = obj[k]; });
}
async function modelOnbellegiYukle(){
  const c = await storageGet('ai_models_cache');
  if(c && typeof c==='object' && Object.keys(c).length){ modelListesiniUygula(c); }
}
// Anthropic Models API'den en güncel modelleri çeker (Haiku/Sonnet/Opus/Fable için her ailenin en yenisi)
async function modelleriGuncelle(){
  const girilen = document.getElementById('aiKeyInput');
  const key = ((girilen && girilen.value.trim()) || (await storageGet('ai_api_key')) || '').trim();
  if(!key){ showToast('Önce API anahtarını gir'); return; }
  const btn = document.getElementById('modelRefreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Güncelleniyor...'; }
  try{
    let liste = [], after = null;
    for(let sayfa=0; sayfa<5; sayfa++){
      const url = 'https://api.anthropic.com/v1/models?limit=100'+(after ? '&after_id='+encodeURIComponent(after) : '');
      const res = await fetch(url, {headers:{'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'}});
      if(!res.ok){
        let msg = 'API hatası ('+res.status+')';
        try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
        throw new Error(msg);
      }
      const j = await res.json();
      liste = liste.concat(j.data || []);
      if(!j.has_more) break;
      after = j.last_id;
    }
    const enYeni = {};
    liste.forEach(function(m){
      const id = String(m.id||'');
      if(id.indexOf('claude-')!==0) return;
      const aile = Object.keys(MODEL_AILE_HINT).find(function(f){ return id.indexOf(f)>=0; });
      if(!aile) return;
      const t = Date.parse(m.created_at) || 0;
      if(!enYeni[aile] || t > enYeni[aile].t) enYeni[aile] = {id:id, t:t, ad:m.display_name};
    });
    const yeni = {};
    Object.keys(MODEL_AILE_HINT).forEach(function(aile){
      const m = enYeni[aile]; if(!m) return;
      yeni[m.id] = {label:String(m.ad||m.id).replace(/^Claude\s+/i,''), hint:MODEL_AILE_HINT[aile]};
    });
    if(!Object.keys(yeni).length) throw new Error('Listede uygun model bulunamadı');
    modelListesiniUygula(yeni);
    await storageSet('ai_models_cache', yeni);
    const sel = document.getElementById('aiModelDefault');
    if(sel){
      const eski = sel.value;
      const secili = gecerliModel(eski);
      sel.innerHTML = Object.keys(AI_MODELS).map(function(m){ return '<option value="'+m+'" '+(m===secili?'selected':'')+'>'+AI_MODELS[m].label+'</option>'; }).join('');
      const h = document.getElementById('aiModelHint'); if(h) h.textContent = AI_MODELS[sel.value].hint;
    }
    showToast('Modeller güncellendi: '+Object.keys(yeni).map(function(k){ return yeni[k].label; }).join(', '));
  }catch(err){
    showToast('Güncellenemedi: '+err.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '🔄 Güncel Modelleri Çek'; }
  }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function bugun(){ return new Date().toLocaleDateString('tr-TR'); }
function nowIso(){ return new Date().toISOString(); }

/* ---------------- STORAGE ----------------
   Claude artifact ortamında window.storage kullanılır (hesaba bağlı, kalıcı).
   Bağımsız barındırma (GitHub Pages, ana ekran kısayolu vb.) durumunda
   window.storage bulunmaz; bu durumda otomatik olarak tarayıcının
   localStorage'ına düşer (o cihaz/tarayıcıya özel, ama tamamen bağımsız çalışır). */
const HAS_CLOUD_STORAGE = !!(window.storage && typeof window.storage.get === 'function');
const LS_PREFIX = 'srk_';

async function storageGet(key){
  if(HAS_CLOUD_STORAGE){
    try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{ const v = localStorage.getItem(LS_PREFIX+key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function storageSet(key,val){
  if(HAS_CLOUD_STORAGE){
    try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
    catch(e){ showToast('Kayıt hatası: veri kaydedilemedi'); return false; }
  }
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); return true; }
  catch(e){ showToast('Kayıt hatası: cihaz depolaması dolu olabilir'); return false; }
}
async function storageDelete(key){
  if(HAS_CLOUD_STORAGE){
    try{ await window.storage.delete(key,false); }catch(e){}
    return;
  }
  try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
}

async function loadIndex(){
  const idx = await storageGet('index');
  state.index = idx || [];
  return state.index;
}
async function saveIndex(){ await storageSet('index', state.index); }

async function loadProject(id){
  const p = await storageGet('proje_'+id);
  state.project = p;
  return p;
}
async function saveProject(p){
  p.sonAktivite = nowIso();
  await storageSet('proje_'+p.id, p);
  const entry = state.index.find(x=>x.id===p.id);
  if(entry){
    entry.isim = p.isim; entry.guncelleme = p.guncelleme; entry.sonAktivite = p.sonAktivite;
    entry.riskSayisi = p.satirlar.length;
    entry.yuksekSayisi = countByLevel(p,'high');
    entry.ortaSayisi = countByLevel(p,'med');
    await saveIndex();
  }
}
function countByLevel(p, level){
  let c=0;
  p.satirlar.forEach(s=>{
    const maxRs = Math.max(0,...s.etkilenenler.map(e=>e.olasilik*e.siddet));
    const lv = seviye(maxRs).key;
    if(lv===level) c++;
  });
  return c;
}

/* ---------------- RISK LEVEL LOGIC ---------------- */
function seviye(rs){
  if(rs>=15) return {key:'high', label:'Yüksek Risk', color:'var(--high)', bg:'var(--high-bg)', hex:'#AE4432', hexbg:'#FAE1DB'};
  if(rs>=8)  return {key:'med',  label:'Orta Risk',   color:'var(--med)',  bg:'var(--med-bg)',  hex:'#A8730C', hexbg:'#FBF0D8'};
  if(rs>=1)  return {key:'low',  label:'Düşük Risk',  color:'var(--low)',  bg:'var(--low-bg)',  hex:'#4C7A52', hexbg:'#E6EEE3'};
  return {key:'none', label:'—', color:'var(--muted)', bg:'#EEEAE0', hex:'#7A766B', hexbg:'#EEEAE0'};
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYMD(s){ const m = String(s).slice(0,10).split('-'); return new Date(Date.UTC(+m[0], (+m[1])-1, +m[2])); }
function ymd(d){ return d.toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = parseYMD(toDateOnly(dateStr)); d.setUTCDate(d.getUTCDate() + (parseInt(n,10)||0)); return ymd(d); }
function gunFarki(a, b){ return Math.round((parseYMD(b) - parseYMD(a)) / 86400000); }
// Termin: satırda yalnızca GÜN sayısı saklanır; tarih her zaman birimin Hazırlanma (Oluşturma) tarihinden hesaplanır.
// Eski kayıtlarda (terminGun yok) kayıtlı termin tarihi aynen gösterilir.
function terminBilgi(s, p){
  const g = (s.terminGun===''||s.terminGun==null) ? NaN : parseInt(s.terminGun,10);
  if(!isNaN(g)) return {gun:g, tarih:addDays((p && p.olusturma) || todayStr(), g)};
  if(s.termin) return {gun:null, tarih:toDateOnly(s.termin)};
  return null;
}
function terminMetni(s, p){
  const t = terminBilgi(s, p);
  if(!t) return '';
  return (t.gun!==null ? t.gun+' gün\n' : '') + fmtDateOnly(t.tarih);
}
function toDateOnly(s){ if(!s) return todayStr(); return String(s).slice(0,10); }
function addYears(dateStr, years){
  const d = parseYMD(toDateOnly(dateStr));
  d.setUTCFullYear(d.getUTCFullYear() + (parseInt(years,10)||2));
  return ymd(d);
}
function fmtDateOnly(dateStr){
  if(!dateStr) return '—';
  const d = new Date(toDateOnly(dateStr)+'T00:00:00');
  return d.toLocaleDateString('tr-TR');
}
function yenilemeOptionsHtml(selected){
  const opts = [[2,'2 Yıl (Çok Tehlikeli Sınıf)'],[4,'4 Yıl (Tehlikeli Sınıf)'],[6,'6 Yıl (Az Tehlikeli Sınıf)']];
  return opts.map(o=>'<option value="'+o[0]+'" '+(String(selected)===String(o[0])?'selected':'')+'>'+o[1]+'</option>').join('');
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

          (s.kaynak==='foto' ? '<span class="chip" style="background:#E4E9EA; color:#3A5A60;">📷 Fotoğraf</span>' : '')+
          (s.kaynak==='coklu' ? '<span class="chip" style="background:#E4E9EA; color:#3A5A60;">📝 Çoklu Giriş</span>' : '')+
          (s.kaynak==='alan' ? '<span class="chip" style="background:#E4E9EA; color:#3A5A60;">🧠 Alan Taraması'+(s.kat?(' · '+esc(s.kat)):'')+'</span>' : '')+

          '<span class="chip">RS max '+maxRs+'</span>'+

async function saveEntry(){
  const tehlike = document.getElementById('fTehlike').value.trim();
  const risk = document.getElementById('fRisk').value.trim();
  const mevcut = document.getElementById('fMevcut').value.trim();
  const onlemler = document.getElementById('fOnlem').value.trim();
  const sorumlu = document.getElementById('fSorumlu').value.trim();
  const tgRaw = document.getElementById('fTerminGun').value.trim();
  const terminGun = tgRaw==='' ? '' : Math.max(0, parseInt(tgRaw,10)||0);
  const termin = terminGun!=='' ? addDays(state.project.olusturma, terminGun) : (formTemp.terminLegacy||'');
  const kapatma = document.getElementById('fKapatma').value || '';
  const durum = document.getElementById('fDurum').value;
  const notlar = document.getElementById('fNot').value.trim();
  const aiBaglam = document.getElementById('fBaglam').value.trim();
  if(!tehlike || !risk){ showToast('Tehlike ve Risk alanları zorunlu'); return; }
  if(!formTemp.etkilenenler.length){ showToast('En az bir etkilenen grubu ekle'); return; }
  const bad = formTemp.etkilenenler.some(e=>!e.grup || !e.grup.trim() || e.grup==='Diğer');
  if(bad){ showToast('Etkilenen grup adı boş olamaz ("Diğer" seçiliyse grup adını yaz)'); return; }
  const yarim = formTemp.etkilenenler.some(e=>!!e.olasilikSonra !== !!e.siddetSonra);
  if(yarim){ showToast('İyileştirme sonrası için O ve Ş değerlerinin ikisini de seç (veya ikisini de boş bırak)'); return; }

  const p = state.project;
  if(formTemp.id){
    const idx = p.satirlar.findIndex(s=>s.id===formTemp.id);
    p.satirlar[idx] = {id:formTemp.id, rk:p.satirlar[idx].rk, tehlike, risk, mevcut, onlemler, sorumlu, termin, terminGun, kapatma, durum, notlar, aiBaglam, kaynak:formTemp.kaynak, etkilenenler:formTemp.etkilenenler};
  } else {
    p.sonRK = (p.sonRK||0)+1;
    p.satirlar.push({id:uid(), rk:p.sonRK, tehlike, risk, mevcut, onlemler, sorumlu, termin, terminGun, kapatma, durum, notlar, aiBaglam, kaynak:'manuel', etkilenenler:formTemp.etkilenenler});
  }
  await saveProject(p);
  closeModal();
  showToast('Risk kaydedildi');
  renderAppbar();
  renderProject();
}

async function applyBookDate(){

  await storageSet('kitap_baslangic_tarihi', tarih);
  let sayac = 0;
  for(const entry of state.index){
    const proj = await storageGet('proje_'+entry.id);
    if(!proj) continue;
    proj.olusturma = tarih;
    proj.guncelleme = addYears(tarih, proj.yenilemeYili||2);

  if(state.view==='project'){ renderAppbar(); renderProject(); } else { renderHome(); }
}

function resizeImageToBase64(file, maxDim){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        if(!img.width || !img.height){
          reject(new Error('Görsel boyutları okunamadı (0x0) — dosya formatı desteklenmiyor olabilir'));
          return;
        }
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = function(){ reject(new Error('Görsel okunamadı')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Dosya okunamadı')); };
    reader.readAsDataURL(file);
  });
}

async function startCokluRiskEkle(){
  const ham = document.getElementById('cokluListe').value || '';
  const liste = ham.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);

async function callClaudeTehlikeSatiri(tehlikeMetni, alanBaglam){
  const sistem = "Sen Türkiye'de çalışan bir İş Sağlığı ve Güvenliği (İSG) uzmanısın. Sana bir 'Tehlike/Faaliyet' tanımı verilecek. 6331 sayılı Kanun ve L Tipi Risk Değerlendirme Matrisi mantığına uygun şekilde, bu tehlikenin doğurabileceği 'risk' (olası sonuç, kısa) ve 'onlem' (planlanan iyileştirici faaliyetler; tek satır düz metin, içine gerçek satır sonu KOYMA) alanlarını üret. 'onlem' alanı için şu kurallara uy: "+ONLEM_KURALLARI+" SADECE aşağıdaki JSON nesnesi formatında yanıt ver; başka hiçbir açıklama, markdown işareti veya metin ekleme:\n{\"risk\":\"...\",\"onlem\":\"...\"}";
  const kullanici = "Tehlike / Faaliyet: "+tehlikeMetni+(alanBaglam?("\nBirim/alan ve kategori: "+alanBaglam):"");
  let model = varsayilanModel();
  const headers = {"content-type":"application/json"};
  if(!HAS_CLOUD_STORAGE){
    const key = await storageGet('ai_api_key');
    if(!key) throw new Error('Önce 🤖 ikonundan API anahtarını gir');
    model = gecerliModel(await storageGet('ai_model'));
    headers['x-api-key'] = key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  async function istekYap(maxTok){
    const gövde = { model, max_tokens: maxTok, system: sistem, messages: [{role:"user", content:kullanici}] };
    const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers, body:JSON.stringify(gövde)});
    if(!res.ok){
      let msg = 'API hatası ('+res.status+')';
      try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    const textBlock = (data.content||[]).find(c=>c.type==='text');
    if(!textBlock || !textBlock.text) throw new Error('Yanıt alınamadı');
    return { text: textBlock.text.trim(), kesildi: data.stop_reason === 'max_tokens' };
  }
  let sonuc = await istekYap(1500);
  if(sonuc.kesildi){ sonuc = await istekYap(3000); }
  const ham = sonuc.text;
  const basla = ham.indexOf('{');
  const bitir = ham.lastIndexOf('}');
  if(basla===-1 || bitir<=basla) throw new Error('AI yanıtı okunamadı, ham yanıt: '+ham.slice(0,400));
  const temiz = ham.slice(basla, bitir+1)
    .replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'")
    .replace(/,\s*([\]}])/g,'$1')
    .replace(/\r\n|\r|\n/g,' ');
  let obj;
  try{ obj = JSON.parse(temiz); }
  catch(e){ throw new Error('AI yanıtı okunamadı, ham yanıt: '+ham.slice(0,400)); }
  return obj;
}

let alanBekleyen = null;

async function startAlanSatirOlustur(){
  const ham = (document.getElementById('alanListe').value || '');
  const maddeler = ham.split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    const i = l.indexOf(' | ');
    return i>0 ? { k: l.slice(0,i).trim(), t: l.slice(i+3).trim() } : { k: '', t: l };
  }).filter(function(m){ return m.t; });
  if(!maddeler.length){ showToast('Listede satır yok'); return; }
  if(maddeler.length > ALAN_MAKS_SATIR){ showToast('En fazla '+ALAN_MAKS_SATIR+' satır oluşturulabilir'); return; }
  const bilgi = alanBekleyen || { komut:'', alan:'' };

function alanIlerlemeGuncelle(biten, toplam, basarili){
  const m = document.getElementById('alanIlerMetin');
  const c = document.getElementById('alanIlerCubuk');
  if(m) m.textContent = biten+' / '+toplam+' işlendi ('+basarili+' satır oluşturuldu)';
  if(c) c.style.width = Math.round(biten*100/toplam)+'%';
}
async function alanSatirlariOlustur(maddeler, komut, alanAdi){
  const p = state.project;
  const n = maddeler.length;
  const alanEtiket = (alanAdi || komut || '').slice(0,150);
  let sonraki = 0, biten = 0, basarili = 0;
  const hatalar = [];
  alanTaramaIptal = false;
  openModal(
    '<div class="modal-title">Satırlar oluşturuluyor</div>'+
    '<div class="confirm-text" id="alanIlerMetin">0 / '+n+' işlendi</div>'+
    '<div style="height:8px; background:#E4E9EA; border-radius:6px; overflow:hidden;"><div id="alanIlerCubuk" style="height:100%; width:0%; background:var(--accent);"></div></div>'+
    '<div class="modal-btn-row" style="margin-top:14px;"><button class="btn ghost" onclick="alanTaramaIptalEt()">İptal et</button></div>'
  );
  async function dene(m){
    const baglam = (m.k ? m.k+' — ' : '') + alanEtiket;
    try{ return await callClaudeTehlikeSatiri(m.t, baglam); }
    catch(e1){
      await new Promise(function(r){ setTimeout(r, 2500); });
      return await callClaudeTehlikeSatiri(m.t, baglam);
    }
  }
  async function isci(){
    while(!alanTaramaIptal){
      const i = sonraki++;
      if(i >= n) return;
      const m = maddeler[i];
      try{
        const sonuc = await dene(m);
        p.sonRK = (p.sonRK||0)+1;
        p.satirlar.push({
          id: uid(), rk: p.sonRK,
          tehlike: m.t, risk: (sonuc.risk||'').trim(), onlemler: (sonuc.onlem||'').trim(),
          durum: 'yapilmadi', notlar: '', aiBaglam: '', kaynak: 'alan', kat: m.k || '',
          etkilenenler: [{id:uid(), grup:ETKILENEN_GRUPLARI[0], olasilik:1, siddet:1}]
        });
        basarili++;
        if(basarili % 10 === 0){ try{ await saveProject(p); }catch(e){} }
      } catch(err){
        hatalar.push(m.t+': '+err.message);
        if(basarili === 0 && hatalar.length >= 4){ alanTaramaIptal = true; }
      }
      biten++;
      alanIlerlemeGuncelle(biten, n, basarili);
    }
  }
  const isciler = [];
  for(let k=0; k<ALAN_ESZAMANLI; k++){ isciler.push(isci()); }
  await Promise.all(isciler);
  closeModal();
  if(basarili>0){ await saveProject(p); }
  renderAppbar(); renderProject();
  if(basarili===0){
    showErrorDetailModal(hatalar.length?hatalar:['Hiçbir satır oluşturulamadı'], 'Satırlar Oluşturulamadı');
  } else {
    showToast(basarili+'/'+n+' satır oluşturuldu — gözden geçir');
    if(hatalar.length) setTimeout(function(){ showErrorDetailModal(hatalar, 'Bazı Satırlar Oluşturulamadı'); }, 1200);
  }
}
async function callClaudeAlanListesi(komut){
  const mevcut = ((state.project && state.project.satirlar) ? state.project.satirlar : [])
    .map(function(r){ return (r.tehlike||'').trim(); }).filter(Boolean).slice(0,150)
    .map(function(t){ return t.slice(0,80); });
  const sistem = "Sen Türkiye'de çalışan deneyimli bir İş Sağlığı ve Güvenliği (İSG) uzmanısın. Kullanıcı bir birim/alan/faaliyet için risk değerlendirme satırları isteyecek. Görevin, o alanda tanımlanabilecek TÜM tehlike ve faaliyetleri ayrı ve tekrarsız satırlar hâlinde, kategorilere ayırarak listelemektir. Sadece satır başlıklarını yaz; risk ve önlem yazma. "
    + "Kapsam: (a) genel tehlikeler: yangın, elektrik, topraklama, düşme/kayma/takılma, çarpma/sıkışma, acil durum ve tahliye, acil çıkış, uyarı işaret ve levhaları, sigara yasağı, periyodik kontrol, bakım-onarım gibi alanın niteliğine uygun olanlar; (b) o alana ÖZGÜ fiziksel, kimyasal, biyolojik, ergonomik ve psikososyal tehlikeler, süreçler, cihaz ve donanımlar. "
    + "Her kategorideki satır sayısını o kategorinin kapsamına göre kendin belirle (kimi kategoride 5-10, kimisinde çok daha fazla satır olabilir); kullanıcı belirli bir sayı veya kapsam belirttiyse ona uy. Toplam en fazla 150 satır yaz. Satır sayısını doldurmak için uydurma yapma, aynı tehlikeyi farklı sözlerle tekrar etme. "
    + "Her satır tek bir tehlike/faaliyet olsun; kısa ve net yaz (örn. 'Kıyma makinesinin kullanımı'). Hastane/sağlık tesisi bağlamında yaz. "
    + "SADECE aşağıdaki JSON dizisi formatında yanıt ver; başka hiçbir açıklama, markdown işareti veya metin ekleme. İlk eleman kısa birim adı olsun, sonrakiler satırlar:\n"
    + "[{\"alan\":\"kısa birim/alan adı\"},{\"k\":\"kategori\",\"t\":\"tehlike/faaliyet\"}]";
  const kullanici = "Alan / komut: " + komut
    + (mevcut.length ? ("\n\nProjede ZATEN VAR olan satırlar (bunları ve eş anlamlılarını tekrar yazma): " + mevcut.join('; ')) : "");
  const sonuc = await claudeMetinIstegi(sistem, kullanici, 6000, 8000);
  const ham = sonuc.text.replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'");
  let alan = '';
  const maddeler = [];
  const gorulen = {};
  (ham.match(/\{[^{}]*\}/g) || []).forEach(function(blok){
    try{
      const o = JSON.parse(blok.replace(/,\s*\}/g,'}'));
      if(o.alan && !alan){ alan = String(o.alan).trim(); }
      const t = String(o.t || '').replace(/\|/g,'/').trim();
      if(t.length < 4) return;
      const anahtar = t.toLowerCase();
      if(gorulen[anahtar]) return;
      gorulen[anahtar] = 1;
      maddeler.push({ k: String(o.k || '').replace(/\|/g,'/').trim(), t: t });
    } catch(e){}
  });
  return { alan: alan, maddeler: maddeler.slice(0, ALAN_MAKS_SATIR), kesildi: sonuc.kesildi };
}

async function callClaudeFotoAnaliz(base64Listesi, ekTalimat){
  const cokluNot = base64Listesi.length>1
    ? ("\n\nSana bu istekte "+base64Listesi.length+" adet fotoğraf birlikte gönderiliyor (sırasıyla 'Fotoğraf 1', 'Fotoğraf 2' ... diye etiketli). Bunlar aynı alanın/durumun farklı açılardan veya birbirine benzer farklı konumların görüntüleri olabilir. Kullanıcının talimatı bu fotoğrafların TAMAMI için geçerlidir: kullanıcı belirli bir satır sayısı istemişse, bu sayı TÜM fotoğraflar için toplamdır — fotoğraf sayısı kadar satır üretmen GEREKMEZ, aynı tespiti tekrar tekrar ayrı satır olarak yazma.")

  const odakliTarama = "Görevin: kullanıcının SANA ÖZELLİKLE BELİRTTİĞİ husus/talimat dışında HİÇBİR ŞEYİ değerlendirmemek, sadece o talimatla sınırlı kalmaktır.\n\nÇOK ÖNEMLİ KURAL: Kullanıcı bir konuya/duruma odaklanmanı istediğinde, fotoğraf(lar)da görünen BAŞKA hiçbir ekipman, makine, malzeme veya tehlikeyi ASLA ayrı satır olarak ekleme — bunları görsen bile yok say. Kullanıcının talimatı senin kapsamının TAMAMIdır, senin kendi ek gözlemlerinle genişletilecek bir taban değildir. Kullanıcı 'sadece 1 satır oluştur' veya 'tek bir satır' derse, tam olarak talimatta istenen konu için 1 satır üret — gönderilen TÜM fotoğraflar için toplamda bu kadar satır üret, fotoğraf başına değil (aynı sorun birden çok fotoğrafta görünüyorsa bunu TEK satırda birleştir, tekrar etme). Kullanıcı satır sayısı belirtmemişse, talimatın kapsadığı konuyu makul şekilde ayrı kalemlere böl ama kesinlikle konu dışına çıkma."+cokluNot+"\n\nEğer fotoğraf(lar)da kullanıcının belirttiği husus/durum hiç yoksa veya tespit edilemiyorsa, boş liste [] döndür — konu dışı başka bir şey bulup onu raporlama.";

  });

  async function istekYap(maxTok){
    const gövde = {
      model, max_tokens: maxTok, system: sistem,
      messages: [{role:'user', content: gorselBloklari.concat([
        {type:'text', text: kullaniciMetni}
      ])}]
    };
    const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers, body:JSON.stringify(gövde)});
    if(!res.ok){
      let msg = 'API hatası ('+res.status+')';
      try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    const textBlock = (data.content||[]).find(c=>c.type==='text');
    if(!textBlock || !textBlock.text) throw new Error('Yanıt alınamadı');
    return { text: textBlock.text.trim(), kesildi: data.stop_reason === 'max_tokens' };
  }

  const ilkLimit = Math.min(6000, 2000 + base64Listesi.length*1000);
  let sonuc = await istekYap(ilkLimit);
  if(sonuc.kesildi){
    sonuc = await istekYap(Math.min(8000, ilkLimit*2)); // çok sayıda madde varsa, çok daha geniş limitle bir kez daha dene
  }
  return ayristirJsonListesi(sonuc.text);
}

function ayristirJsonListesi(ham){
  const basla = ham.indexOf('[');
  const bitir = ham.lastIndexOf(']');
  if(basla!==-1 && bitir>basla){
    const temiz = ham.slice(basla, bitir+1)
      .replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'")
      .replace(/,\s*([\]}])/g,'$1')
      .replace(/\r\n|\r|\n/g,' ');
    try{
      const liste = JSON.parse(temiz);
      if(Array.isArray(liste)) return liste;
    } catch(e){ /* aşağıdaki kurtarma mekanizmasına düş */ }
  }
  // Kurtarma: cevap yarıda kesilmiş olsa bile, TAM biten {...} nesnelerini tek tek ayıklayıp kullan
  if(basla!==-1){
    const kurtarilan = [];
    let derinlik = 0, nesneBaslangic = -1;
    for(let i=basla; i<ham.length; i++){
      const ch = ham[i];
      if(ch==='{'){ if(derinlik===0) nesneBaslangic=i; derinlik++; }
      else if(ch==='}'){
        derinlik--;
        if(derinlik===0 && nesneBaslangic!==-1){
          const parca = ham.slice(nesneBaslangic, i+1)
            .replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'")
            .replace(/\r\n|\r|\n/g,' ');
          try{ const obj = JSON.parse(parca); if(obj && obj.tehlike) kurtarilan.push(obj); } catch(e){}
          nesneBaslangic = -1;
        }
      }
    }
    if(kurtarilan.length) return kurtarilan;
  }
  throw new Error('Model JSON dizisi döndürmedi, ham yanıt: '+ham.slice(0,600));
}

const OLAS_METIN = ['Gerçekleşme ihtimali çok az','Gerçekleşme ihtimali az','Gerçekleşme ihtimali var (Her zaman mümkün)','Gerçekleşme ihtimali yüksek','Gerçekleşme ihtimali çok yüksek'];
const SID_METIN = ['İşyerinde (revirde) müdahale edilen hafif yaralanmalar','İşyeri dışında tıbbi müdahale gerektiren işgünü kayıpsız hafif yaralanmalar','10 günden daha az işgünü kaybı ile sonuçlanan yaralanmalar','Ağır yaralanma veya uzuv kaybıyla sonuçlanan yaralanmlar','Ölümle sonuçlanan kazalar'];
const SID_BASLIK = ['1 (Önemsiz)','2 (Küçük)','3 (Önemli)','4 (Çok Ciddi)','5 (Ölümcül)'];
const OLAS_BASLIK = ['1 (Çok Düşük)','2 (Düşük)','3 (Mümkün)','4 (Yüksek)','5 (Çok Yüksek)'];

function rsRenk(v){ return v>=15 ? RENK.red : (v>=7 ? RENK.yellow : RENK.green); }
function oncelikMetni(v){ return v>=15 ? '1.Öncelik (Kabul Edilemez)' : (v>=8 ? '2.Öncelik (Dikkat)' : '3.Öncelik (Kabul Edilebilir)'); }
function satirSayisiTahmin(metin, genislik){
  if(!metin) return 1;
  const cpl = Math.max(4, Math.floor(genislik*0.95));
  return String(metin).split('\n').reduce(function(a,par){ return a + Math.max(1, Math.ceil(par.length/cpl)); }, 0);
}

function buildSheetModel(p){
  const cells = [];
  const rh = Object.assign({}, TPL.rowH);
  function add(r1,c1,r2,c2,val,st){
    cells.push({r1:r1,c1:c1,r2:r2,c2:c2,val:val,
      st:Object.assign({size:10,h:'center',bold:false,color:'000000',fill:null,border:true,rs:null}, st||{})});
  }
  const WH = 'FFFFFF';

  /* --- Satır 1-3: kurum bilgileri --- */
  add(1,1,1,18,null,{border:false});
  add(2,1,2,3,'Birim/Bölüm Adı : '+(p.isim||''),{fill:RENK.teal,color:WH,h:'left',size:11});
  add(3,1,3,3,'Hazırlanma Tarihi : '+fmtDateOnly(p.olusturma),{fill:RENK.teal,color:WH,h:'left',size:11});
  add(2,5,3,11,TPL.title,{fill:RENK.slate,color:WH,bold:true,size:13});
  add(2,14,2,18,'Risk Analiz Yöntemi : 5x5 L Tipi Matris',{fill:RENK.teal,color:WH,h:'left',size:11});
  add(3,14,3,18,'Güncelleme Tarihi : '+fmtDateOnly(p.guncelleme),{fill:RENK.teal,color:WH,h:'left',size:11});

  /* --- Satır 5: parametre başlığı --- */
  add(5,1,5,18,'Risk Analizi Parametreleri (Olasılık x Şiddet = Risk Skoru(RS))',{fill:RENK.blueGray,color:WH,bold:true,size:12});

  /* --- Satır 7-13: olasılık / şiddet skalası + matris + renk açıklaması --- */
  add(7,1,7,3,'Olasılık (O)',{fill:RENK.amber,size:11});
  add(8,1,8,3,'Olasılık Değeri Dereceleri',{fill:'ADADAD',size:10});
  add(7,4,13,4,null,{border:false});
  add(7,5,7,9,'Şiddet (Ş)',{fill:RENK.amber,size:11});
  add(8,5,8,9,'Şiddet Değeri Dereceleri ',{fill:'ADADAD',size:10});
  add(7,11,7,16,'RİSK MATRİSİ (OLASILIK x ŞİDDET)',{fill:RENK.amber,size:11});
  add(8,11,8,11,'Olasılık \\ Şiddet',{size:9});
  for(let j=0;j<5;j++){ add(8,12+j,8,12+j,SID_BASLIK[j],{fill:GRI[j],size:9}); }
  for(let i=0;i<5;i++){
    const r = 9+i;
    add(r,1,r,1,i+1,{size:10});
    add(r,2,r,3,OLAS_METIN[i],{h:'left',size:9});
    add(r,5,r,5,i+1,{size:10});
    add(r,6,r,9,SID_METIN[i],{h:'left',size:9});
    add(r,11,r,11,OLAS_BASLIK[i],{fill:GRI[i],size:9});
    for(let j=0;j<5;j++){ const v=(i+1)*(j+1); add(r,12+j,r,12+j,v,{fill:rsRenk(v),size:10}); }
  }
  add(7,18,8,18,'Yeşil Alanlar: Düşük öncelikli kontrol faaliyetleri. Mevcut durum korunmalı (kabul edilebilir riskler için)',{fill:RENK.green,size:8});
  add(9,18,10,18,'Turuncu Alanlar: İkinci öncelikli kontrol faaliyetleri. Orta vadede (3-12 ay)  önlem alınmalı (dikkat gerektiren riskler için)',{fill:RENK.yellow,size:8});
  add(11,18,13,18,'Kırmızı Alanlar: Birinci öncelikli kontrol faaliyetleri. Derhal veya kısa sürede (0-3 ay) önlem alınmalı (kabul edilemez riskler için)',{fill:RENK.red,size:8});

  /* --- Satır 15-17: grup başlıkları ve sütun başlıkları --- */
  const hw = {color:WH,bold:true,size:11};
  add(15,1,15,5,'TEHLİKELERİ TANIMLAMA VE RİSKLERİ BELİRLEME',Object.assign({fill:RENK.orange},hw));
  add(15,6,15,9,'RİSK ANALİZİ',Object.assign({fill:RENK.rust},hw));
  add(15,10,15,18,'İYİLEŞTİRİCİ FAALİYET SÜRECİ',Object.assign({fill:RENK.teal},hw));
  [[1,'No'],[2,'Tanımlanan\nTehlikeler'],[3,'Belirlenen\nRiskler'],[4,'Mevcut Durum ve\nTedbirler'],[5,'Etkilenenler']].forEach(function(h){
    add(16,h[0],17,h[0],h[1],Object.assign({fill:RENK.orange},hw)); });
  [[6,'Olasılık'],[7,'Şiddet'],[8,'Risk\nSkoru'],[9,'Öncelik']].forEach(function(h){
    add(16,h[0],17,h[0],h[1],Object.assign({fill:RENK.rust},hw)); });
  add(16,10,17,11,'Planlanan İyileştirici\nFaaliyetler',Object.assign({fill:RENK.teal},hw));
  add(16,12,17,12,'Sorumlular',Object.assign({fill:RENK.teal},hw));
  add(16,13,17,13,'Termin',Object.assign({fill:RENK.teal},hw));
  add(16,14,17,14,'Kapatma\nTarihi',Object.assign({fill:RENK.teal},hw));
  add(16,15,16,17,'İyileştirme Sonrası Tespit Edilen Risk Düzeyi',Object.assign({fill:RENK.teal},hw));
  add(17,15,17,15,'Olasılık',Object.assign({fill:RENK.teal},hw));
  add(17,16,17,16,'Şiddet',Object.assign({fill:RENK.teal},hw));
  add(17,17,17,17,'RS',Object.assign({fill:RENK.teal},hw));
  add(16,18,17,18,'Açıklama',Object.assign({fill:RENK.teal},hw));

  /* --- Satır 18+: her risk = 5 satırlık blok (S = 18 + (N-1)*5) --- */
  let r = TPL.first, blokNo = 0;
  const blokListesi = [];
  const sirali = p.satirlar.slice().sort(function(a,b){ return a.rk-b.rk; });
  sirali.forEach(function(s){
    const gruplar = s.etkilenenler || [];
    const parcalar = [gruplar];            // tek blok: satır sayısı = etkilenen sayısı (en az 1)
    parcalar.forEach(function(chunk, ci){
      const N = Math.max(1, chunk.length);
      const S = r, E = r+N-1;
      const shade = (blokNo%2===0) ? RENK.shade : RENK.white;
      blokNo++;
      const txt = {h:'left', fill:shade}, ctr = {h:'center', fill:shade};
      const aciklama = ci===0 ? ('Durum: '+durumBilgi(s.durum).label+(s.notlar?('\n'+s.notlar):'')) : '';
      const v = ci===0 ? {tehlike:s.tehlike||'', risk:s.risk||'', mevcut:s.mevcut||'', onlem:s.onlemler||'',
                          sorumlu:s.sorumlu||'', termin:terminMetni(s,p), kapatma:s.kapatma?fmtDateOnly(s.kapatma):'', acik:aciklama}
                       : {tehlike:'(devam)', risk:'', mevcut:'', onlem:'', sorumlu:'', termin:'', kapatma:'', acik:''};
      add(S,1,E,1,s.rk,ctr);
      add(S,2,E,2,v.tehlike,txt);
      add(S,3,E,3,v.risk,txt);
      add(S,4,E,4,v.mevcut,txt);
      add(S,10,E,11,v.onlem,txt);
      add(S,12,E,12,v.sorumlu,ctr);
      add(S,13,E,13,v.termin,ctr);
      add(S,14,E,14,v.kapatma,ctr);
      add(S,18,E,18,v.acik,txt);
      for(let k=0;k<N;k++){
        const rr = S+k, e = chunk[k];
        const rs = e ? e.olasilik*e.siddet : null;
        const rs2 = (e && e.olasilikSonra && e.siddetSonra) ? e.olasilikSonra*e.siddetSonra : null;
        add(rr,5,rr,5,e?e.grup:'',txt);
        add(rr,6,rr,6,e?e.olasilik:null,ctr);
        add(rr,7,rr,7,e?e.siddet:null,ctr);
        add(rr,8,rr,8,{f:'IF(AND(F'+rr+'<>"",G'+rr+'<>""),F'+rr+'*G'+rr+',"")', res: rs===null?'':rs}, Object.assign({rs:rs,cf:true},ctr));
        add(rr,9,rr,9,{f:'IF(H'+rr+'="","",IF(H'+rr+'>=15,"1.Öncelik (Kabul Edilemez)",IF(H'+rr+'>=8,"2.Öncelik (Dikkat)","3.Öncelik (Kabul Edilebilir)")))', res: rs===null?'':oncelikMetni(rs)}, Object.assign({rs:rs,cf:true,size:8},ctr));
        add(rr,15,rr,15,(e&&e.olasilikSonra)?e.olasilikSonra:null,ctr);
        add(rr,16,rr,16,(e&&e.siddetSonra)?e.siddetSonra:null,ctr);
        add(rr,17,rr,17,{f:'IF(AND(O'+rr+'<>"",P'+rr+'<>""),O'+rr+'*P'+rr+',"")', res: rs2===null?'':rs2}, Object.assign({rs:rs2,cf:true},ctr));
      }
      // satır yüksekliği: birleşik metin hücrelerine sığacak kadar
      const gerekli = Math.max(
        satirSayisiTahmin(v.tehlike,24), satirSayisiTahmin(v.risk,22), satirSayisiTahmin(v.mevcut,26),
        satirSayisiTahmin(v.onlem,40), satirSayisiTahmin(v.acik,20), satirSayisiTahmin(v.sorumlu,12), satirSayisiTahmin(v.termin,13)
      ) * 12.75 + 6;
      const h = Math.max(TPL.minH, gerekli/N);   // uzun metin satırları eşit paylaşır
      for(let k=0;k<N;k++) rh[S+k] = h;
      blokListesi.push({S:S, n:N});
      r += N;
    });
  });
  return {cells:cells, rh:rh, lastRow:r-1, nBlok:blokNo, bloklar:blokListesi};
}

/* ---------------- EXCEL (.xlsx) ---------------- */
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise(function(resolve,reject){
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload = function(){ window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('ExcelJS yüklenemedi')); };
    sc.onerror = function(){ reject(new Error('ExcelJS yüklenemedi — internet bağlantını kontrol et')); };
    document.head.appendChild(sc);
  });
}
function buildExcelWorkbook(p, EJ){
  const model = buildSheetModel(p);
  const wb = new EJ.Workbook();
  wb.creator = 'Saha Risk Kaydı';
  const ws = wb.addWorksheet(TPL.sheet, {
    views: [{showGridLines:false}],
    pageSetup: {orientation:'landscape', paperSize:8, fitToPage:true, fitToWidth:1, fitToHeight:0,
                horizontalCentered:true, printTitlesRow:'2:17',
                margins:{left:0.236,right:0.236,top:0.394,bottom:0.906,header:0.118,footer:0.315}}
  });
  ws.headerFooter.oddFooter = '&C&P';
  TPL.widths.forEach(function(w,i){ ws.getColumn(i+1).width = w; });
  for(let r=1;r<=model.lastRow;r++){ ws.getRow(r).height = model.rh[r] || TPL.minH; }

  const thin = {style:'thin', color:{argb:'FF000000'}};
  model.cells.forEach(function(cl){
    const merged = (cl.r1!==cl.r2 || cl.c1!==cl.c2);
    if(merged) ws.mergeCells(cl.r1,cl.c1,cl.r2,cl.c2);
    for(let rr=cl.r1; rr<=cl.r2; rr++){
      for(let cc=cl.c1; cc<=cl.c2; cc++){
        const c = ws.getCell(rr,cc);
        c.font = {name:'Arial', size:cl.st.size, bold:!!cl.st.bold, color:{argb:'FF'+cl.st.color}};
        if(cl.st.fill) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+cl.st.fill}};
        c.alignment = {horizontal:cl.st.h, vertical:'middle', wrapText:true};
        if(cl.st.border) c.border = {top:thin,left:thin,bottom:thin,right:thin};
      }
    }
    const m = ws.getCell(cl.r1,cl.c1);
    if(cl.val && typeof cl.val==='object') m.value = {formula:cl.val.f, result:cl.val.res};
    else if(cl.val!==null && cl.val!=='') m.value = cl.val;
  });

  const last = model.lastRow;
  const dolgu = function(argb){ return {fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF'+argb},bgColor:{argb:'FF'+argb}}, font:{color:{argb:'FF000000'}}}; };
  function kurallar(a){ // a: sol üst hücre (göreli adres)
    return [
      {type:'expression', formulae:['AND(ISNUMBER('+a+'),'+a+'<=6)'], style:dolgu(RENK.green)},
      {type:'expression', formulae:['AND(ISNUMBER('+a+'),'+a+'>=7,'+a+'<15)'], style:dolgu(RENK.yellow)},
      {type:'expression', formulae:['AND(ISNUMBER('+a+'),'+a+'>=15)'], style:dolgu(RENK.red)}
    ];
  }
  ws.addConditionalFormatting({ref:'H18:H'+last, rules:kurallar('H18')});
  ws.addConditionalFormatting({ref:'Q18:Q'+last, rules:kurallar('Q18')});
  ws.addConditionalFormatting({ref:'I18:I'+last, rules:kurallar('$H18')});

  for(let rr=TPL.first; rr<=last; rr++){
    ['F','G','O','P'].forEach(function(col){
      ws.getCell(col+rr).dataValidation = {type:'list', allowBlank:true, formulae:['"1,2,3,4,5"']};
    });
  }
  return wb;
}
async function exportExcel(){
  const p = state.project;
  if(!p.satirlar.length){ showToast('Dışa aktarılacak kayıt yok'); return; }
  showToast('Excel hazırlanıyor...');
  let EJ;
  try{ EJ = await loadExcelJS(); }catch(err){ showToast(err.message); return; }
  try{
    const wb = buildExcelWorkbook(p, EJ);
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ad = (p.isim||'birim').replace(/[\\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,'_');
    a.href = url; a.download = 'Risk_Degerlendirme_'+ad+'.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast('Excel indirildi');
  }catch(err){
    showToast('Excel oluşturulamadı: '+err.message);
  }
}

/* ---------------- YAZDIR / PDF (A3 yatay, aynı şablon) ---------------- */
function renderSheetHtml(model){
  const SC = 0.8; // 18 sütunlu şablon A3 yatay sayfaya sığsın diye yazı/satır ölçeği
  const baslangic = {}, kapli = {};
  model.cells.forEach(function(cl){
    baslangic[cl.r1+','+cl.c1] = cl;
    for(let r=cl.r1;r<=cl.r2;r++) for(let c=cl.c1;c<=cl.c2;c++){ if(!(r===cl.r1 && c===cl.c1)) kapli[r+','+c] = true; }
  });
  function metin(cl){
    const v = cl.val;
    if(v===null || v===undefined) return '';
    if(typeof v==='object') return esc(String(v.res));
    return esc(String(v));
  }
  const REF = 1150;   // A3 yatay kullanılabilir genişlik (pt); tüm boyutlar sayfa genişliğine orantılı ölçeklenir
  function cq(pt){ return (pt/REF*100).toFixed(3)+'cqw'; }
  function trHtml(r, kat){
    const hp = (model.rh[r]||TPL.minH)*SC*(kat||1);
    let h = '<tr style="height:'+hp.toFixed(1)+'pt; height:'+cq(hp)+';">';
    for(let c=1;c<=18;c++){
      const key = r+','+c;
      if(kapli[key]) continue;
      const cl = baslangic[key];
      if(!cl){ h += '<td></td>'; continue; }
      const fill = (cl.st.rs!==null && cl.st.rs!==undefined) ? rsRenk(cl.st.rs) : cl.st.fill;
      let sty = 'font-size:'+(cl.st.size*SC).toFixed(1)+'pt; font-size:'+cq(cl.st.size*SC)+'; text-align:'+cl.st.h+'; vertical-align:middle; white-space:pre-line; color:#'+cl.st.color+';';
      if(fill) sty += ' background:#'+fill+';';
      if(cl.st.bold) sty += ' font-weight:700;';
      if(cl.st.border) sty += ' border:0.6pt solid #000;';
      h += '<td'+(cl.r2>cl.r1?' rowspan="'+(cl.r2-cl.r1+1)+'"':'')+(cl.c2>cl.c1?' colspan="'+(cl.c2-cl.c1+1)+'"':'')+' style="'+sty+'">'+metin(cl)+'</td>';
    }
    return h + '</tr>';
  }
  const pw = TPL.widths.slice(); for(let i=11;i<=15;i++) pw[i] = 12;   // matris sütunları (L–P) eşit genişlikte
  const toplam = pw.reduce(function(a,b){ return a+b; },0);
  let html = '<table class="pr-sheet"><colgroup>'+pw.map(function(w){ return '<col style="width:'+(w/toplam*100).toFixed(3)+'%">'; }).join('')+'</colgroup><thead>';
  [2,3,5,7,8,9,10,11,12,13,15,16,17].forEach(function(r){ html += trHtml(r); });   // boş satırlar (1,4,6,14) hariç tüm başlık satırları her sayfada tekrarlanır
  html += '</thead>';
  for(let b=0;b<model.bloklar.length;b++){
    html += '<tbody>';
    for(let k=0;k<model.bloklar[b].n;k++) html += trHtml(model.bloklar[b].S + k, 1.1);
    html += '</tbody>';
  }
  return html + '</table>';
}
function exportPdf(){
  const p = state.project;
  if(!p.satirlar.length){ showToast('Yazdırılacak kayıt yok'); return; }
  document.getElementById('printArea').innerHTML = renderSheetHtml(buildSheetModel(p));
  setTimeout(()=>{ window.print(); }, 80);
}

async function exportAllData(){
  const bundle = { tip:'saha-risk-kaydi-yedek', versiyon:1, olusturma:nowIso(), index: state.index, projeler:{} };
  for(const p of state.index){
    const full = await storageGet('proje_'+p.id);
    if(full) bundle.projeler[p.id] = full;
  }
  const blob = new Blob([JSON.stringify(bundle,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href = url; a.download = 'risk-kayit-yedek-'+ts+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showToast('Yedek indirildi — kaydetme ekranından iCloud/Drive seçebilirsin');
}

function importAllData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ showToast('Dosya okunamadı: geçersiz JSON'); return; }
    if(!data || data.tip!=='saha-risk-kaydi-yedek' || !data.projeler){
      showToast('Bu bir yedek dosyası değil'); return;
    }
    let eklenen=0, guncellenen=0;
    for(const pid in data.projeler){
      const proj = data.projeler[pid];
      const varMi = state.index.find(x=>x.id===pid);
      await storageSet('proje_'+pid, proj);
      if(varMi){
        varMi.isim=proj.isim; varMi.guncelleme=proj.guncelleme; varMi.sonAktivite=proj.sonAktivite||proj.guncelleme;
        varMi.riskSayisi=proj.satirlar.length;
        varMi.yuksekSayisi=countByLevel(proj,'high'); varMi.ortaSayisi=countByLevel(proj,'med');
        guncellenen++;
      } else {
        state.index.push({id:pid, isim:proj.isim, guncelleme:proj.guncelleme, sonAktivite:proj.sonAktivite||proj.guncelleme,
          riskSayisi:proj.satirlar.length, yuksekSayisi:countByLevel(proj,'high'), ortaSayisi:countByLevel(proj,'med')});
        eklenen++;
      }
    }
    await saveIndex();
    closeModal();
    showToast(eklenen+' yeni, '+guncellenen+' güncellenen birim yüklendi');
    goHome();
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ---------------- INIT ---------------- */
async function init(){
  await modelOnbellegiYukle();
  await loadIndex();
  renderAppbar();
  renderHome();
}
init();
</script>
